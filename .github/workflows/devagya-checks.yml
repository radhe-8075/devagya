name: Devagya checks

on:
  push:
    branches: [devagya-2.0]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check smart-campus.js
          node --check workflow.js
          node --check public/script.js
          node --check public/smart-campus.js
      - name: Run functional tests
        run: npm test
      - name: Run rule-based stress tests
        run: node stress-test.js
